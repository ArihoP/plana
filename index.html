<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PLANA</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8f1fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PLANA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Countdown, booking progress and pose inspiration for each photography booking.">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/firebase-config.js"></script>
<script>window.__backendReady = new Promise(function(r){ window.__setBackend = r; });</script>
<script src="/backend.js" defer onerror="window.__setBackend(null)"></script>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: three pages (Bookings, Calendar, Inspiration). Bookings and Calendar both end in one booking's countdown, progress and the pose library for its type. */
:root{
  --bg:#e8f1fc; --surface:#ffffff; --ink:#1b2a3b; --muted:#5a6b7e; --line:#dce5f0;
  --accent:#17639f; --on-accent:#ffffff; --accent-soft:#d4e6f8; --ok:#1d7a4a; --warn:#b4620f; --shade:rgba(15,30,50,.45);
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;min-width:0;max-width:100%}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:20px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;font:700 24px/1.1 var(--body);color:var(--accent)}
.mark small{display:block;font:400 13px/1.3 var(--body);color:var(--muted);margin-top:2px}
.logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:700 22px/1 var(--body);flex:none}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.nav button{border:0;background:none;border-radius:7px;padding:7px 14px;font-weight:600;color:var(--muted);min-height:38px}
.nav button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--warn)}
.layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:24px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font-weight:600;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .dl{font:600 22px/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.item .dl span{font:500 11px var(--body);color:var(--muted);display:block;letter-spacing:.04em}
.item .meta{color:var(--muted);font-size:13px}
.item .bar{grid-column:1/-1;margin-top:8px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px;vertical-align:middle}
.chip.ex{color:var(--muted);background:var(--line)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:24px 18px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:12px}

.detail{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 28px;align-items:center}
.count{font:700 clamp(64px,11vw,96px)/.9 var(--body);color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.count-l{font-weight:600;margin-top:6px}
.count-s{color:var(--muted);font-size:13px}
.hero h2{margin:0 0 4px;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:14px;margin-top:6px}
.notes{margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.hero-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ph h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ph .big{font:600 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.next{margin:10px 0 14px;color:var(--muted);font-size:14px}
.next b{color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.step.done label span{color:var(--muted);text-decoration:line-through}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.x{background:none;border:0;color:var(--muted);padding:4px 8px;border-radius:6px;font-size:18px;line-height:1}
.x:hover{color:var(--warn)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-height:40px}
textarea{min-height:80px;resize:vertical}
.group{margin-top:18px}
.group:first-of-type{margin-top:6px}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.gh h4{margin:0;font-size:15px}
.gh .cnt{color:var(--muted);font-size:13px;font-weight:500;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pose{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.pose .im{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--line);border:0;padding:0;display:block;width:100%}
.pose img{width:100%;height:100%;object-fit:cover;display:block}
.pose.shot img{opacity:.45}
.pose .tick{position:absolute;top:6px;left:6px;background:var(--surface);border-radius:5px;padding:2px;display:flex}
.pose .del{position:absolute;top:4px;right:4px;background:var(--surface);border-radius:5px;border:0}
.pose input.cap{border:0;background:none;padding:2px 0;min-height:0;font-size:16px;color:var(--muted)}
.pose .capt{font-size:13px;color:var(--muted);overflow-wrap:anywhere;min-height:1.4em}
.drop{aspect-ratio:3/4;border:1px dashed var(--line);border-radius:8px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:13px;padding:8px}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.note{color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:20}
.sheet{background:var(--surface);border-radius:12px;width:min(520px,100%);padding:22px;margin-block:auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font:700 22px var(--body)}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0}
.sheet{max-width:100%}
.sheet .acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.light{display:flex;align-items:center;justify-content:center;background:var(--shade);position:fixed;inset:0;z-index:30;padding:16px}
.light img{max-width:100%;max-height:100%;border-radius:8px}
.back{display:none}

/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:24px;align-items:start}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calhead h2{margin:0;font:700 22px/1 var(--body);flex:1;min-width:0}
.calhead .btn{min-width:40px;padding:6px 10px}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow div{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.cell{display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;min-height:76px;padding:6px;background:var(--bg);border:1px solid transparent;border-radius:8px;min-width:0;overflow:hidden}
.cell.out{opacity:.4}
.cell .n{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.cell.today .n{background:var(--accent);color:var(--on-accent)}
.cell[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--surface)}
.ev{display:block;font-size:11px;font-weight:600;line-height:1.3;padding:2px 5px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(var(--accent),var(--accent)) left bottom/var(--p) 3px no-repeat,var(--accent-soft)}
.cell.past .ev{opacity:.6}
.more{font-size:11px;color:var(--muted)}
.daypanel{display:flex;flex-direction:column;gap:12px;min-width:0}
.daypanel h3{margin:0;font:700 20px/1.2 var(--body)}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.dcard .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dcard .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.dcard .when{font:600 15px/1.2 var(--mono);text-align:right;white-space:nowrap}
.dcard .pct{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* inspiration */
.inspohead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.inspohead label{font-weight:600;color:var(--muted);font-size:13px}
.inspohead select{width:auto;min-width:200px;font-weight:600}
.inspohead .note{flex:1;min-width:200px}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .layout[data-view="list"] .detail,.layout[data-view="detail"] .side{display:none}
  .back{display:inline-flex}
  .hero{grid-template-columns:1fr}
  .calwrap{grid-template-columns:minmax(0,1fr)}
  .cell{min-height:56px;padding:4px}
  .ev{font-size:0;padding:0;height:5px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent)) left center/var(--p) 100% no-repeat,var(--accent-soft)}
  .nav{width:100%}.nav button{flex:1;padding-inline:6px}
}
@media (max-width:480px){
  .row2{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:18px}
  .hero{padding:18px}
  section.panel{padding:16px}
}
.hdr-r{display:flex;gap:8px;align-items:center}
.acct{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:16px;padding:0}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}
.auth{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.authcard{margin-block:auto;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.authcard .mark{justify-content:center}
.authbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:8px;font-weight:600;color:var(--muted);min-height:38px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.err{color:var(--warn);font-size:14px;min-height:1.2em}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;text-align:left}
.dvlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dv:first-child{border-top:0}
.dv label.dvl{display:flex;align-items:center;gap:10px;cursor:pointer;overflow-wrap:anywhere;font-weight:600;min-width:0}
.dv.done .dvl span{color:var(--muted);text-decoration:line-through}
.dv .dvrow{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:30px}
.dv input[type=date]{width:auto;min-height:36px;padding:5px 8px}
.dvs{font-size:13px;font-weight:600;color:var(--muted)}
.dvs.late,.dcard .when.late{color:var(--warn)}
.dvs.ok,.dcard .when.ok{color:var(--ok)}
.addrow.wrap{flex-wrap:wrap}
.addrow.wrap input[type=date]{flex:0 0 auto;width:auto}
.ev.dev{background:none;border:1px dashed var(--accent);padding:1px 4px;color:var(--accent)}
.ev.dev.ok{opacity:.6;text-decoration:line-through}
.cal{touch-action:pan-y}
.swipehint{display:none;text-align:center;margin-top:10px}
.item .nd{grid-column:1/-1}
@media (max-width:820px){
  .ev.dev{padding:0;height:5px;border-radius:3px;border-style:solid}
  .swipehint{display:block}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="mark"><span class="logo">P</span><span>PLANA<small>Bookings, calendar and poses</small></span></div>
    <nav class="nav" aria-label="Pages">
      <button id="nav-cal" aria-selected="true">Calendar</button>
      <button id="nav-bookings" aria-selected="false">Bookings</button>
      <button id="nav-inspo" aria-selected="false">Inspiration</button>
    </nav>
    <div class="hdr-r"><button class="btn primary" id="new">New booking</button><button class="acct" id="acct" hidden aria-label="Account"></button></div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <div id="v-bookings" hidden>
    <div class="layout" id="layout" data-view="list">
      <aside class="side">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-up" aria-selected="true">Upcoming</button>
          <button class="tab" role="tab" id="tab-past" aria-selected="false">Past</button>
        </div>
        <div class="list" id="list"></div>
      </aside>
      <main class="detail" id="detail"></main>
    </div>
  </div>

  <div id="v-cal">
    <div class="calwrap">
      <div class="cal" id="cal"></div>
      <div class="daypanel" id="daypanel"></div>
    </div>
  </div>

  <div id="v-inspo" hidden></div>
  <div class="note" id="mode" style="margin-top:16px"></div>
</div>
<div id="modal"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
(function(){
const DEFAULT_CATS = ['Wedding','Proposal','Introduction','Photo shoot'];
let customTypes = [];      // added by the user, e.g. Conference
const allTypes = () => [...DEFAULT_CATS, ...customTypes];
const slug = c => c.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'type';
const STEPS = {
  'Wedding':['Inquiry received','Quote sent','Deposit paid','Contract signed','Venue and timeline confirmed','Poses chosen','Shoot day','Gallery delivered'],
  'Proposal':['Inquiry received','Quote sent','Deposit paid','Location and surprise plan confirmed','Poses chosen','Shoot day','Gallery delivered'],
  'Introduction':['Inquiry received','Quote sent','Deposit paid','Outfits and location agreed','Poses chosen','Shoot day','Gallery delivered'],
  'Photo shoot':['Inquiry received','Quote sent','Deposit paid','Location agreed','Poses chosen','Shoot day','Gallery delivered']
};
const GROUPS = {
  'Wedding':['Getting ready','Couple portraits','Ceremony','Family','Wedding party','Details'],
  'Proposal':['Setup and reveal','The moment','Reactions','Celebration'],
  'Introduction':['Couple together','Close and candid','Walking','Seated'],
  'Photo shoot':['Posed','Candid','Details']
};
const stepsFor = t => STEPS[t] || ['Inquiry received','Quote sent','Deposit paid','Schedule and coverage agreed','Event day','Gallery delivered'];
const groupsFor = t => GROUPS[t] || ['Poses'];
const DELIVERY_DEFAULTS = {
  'Wedding':[['Online photos',14],['Highlight reel',30],['Full prints',45],['Photo book',60]],
  'Proposal':[['Online photos',7],['Highlight reel',14]],
  'Introduction':[['Online photos',10],['Prints',21]],
  'Photo shoot':[['Online photos',7]]
};
const deliveriesFor = t => DELIVERY_DEFAULTS[t] || [['Online photos',7]];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,8));
const normType = t => t || 'Photo shoot';
const sig = o => JSON.stringify(o, (k, v) => (v && typeof v === 'object' && !Array.isArray(v)) ? Object.keys(v).sort().reduce((a, key) => (a[key] = v[key], a), {}) : v);

let bookings = [];
let lib = {};              // type -> {id, type, poses:[{id,url,asset,caption,group}], groups:[]}
let selId = null;
let tab = 'up';
let view = 'cal';
let inspoCat = 'Wedding';
let inspoAdding = false;
let calMonth = new Date(); calMonth.setDate(1);
let calSel = null;
let store = null;
let assets = null;
let backend = null, session = null, currentUser = null, authMode = 'in';
let cloud = {poses:[], groups:[]};
const timers = {};

// ---------- dates ----------
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const parseDate = s => { const [y,m,d] = (s||'').split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const daysLeft = b => b.date ? Math.round((parseDate(b.date) - midnight(new Date())) / 86400000) : null;
const fmtDate = b => b.date ? parseDate(b.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}) : 'No date yet';
function span(n){
  n = Math.abs(n);
  const w = Math.floor(n/7), d = n % 7;
  if (n < 7) return n + (n===1?' day':' days');
  return w + (w===1?' week':' weeks') + (d ? ' ' + d + (d===1?' day':' days') : '');
}
const progress = b => { const s=b.steps||[]; return s.length ? Math.round(s.filter(x=>x.done).length / s.length * 100) : 0; };
const whenText = d => d===null ? 'No date' : d===0 ? 'Today' : d>0 ? d + (d===1?' day left':' days left') : Math.abs(d) + (d===-1?' day ago':' days ago');
function makeDeliveries(type, date){
  return deliveriesFor(type).map(([label, days]) => {
    let when = '';
    if(date){ const d = parseDate(date); d.setDate(d.getDate() + days); when = ymd(d); }
    return {id:uid(), label, date:when, done:false};
  });
}
function dvState(dv){
  if(dv.done) return {text:'Delivered', cls:'ok'};
  if(!dv.date) return {text:'No date set', cls:''};
  const n = Math.round((parseDate(dv.date) - midnight(new Date())) / 86400000);
  if(n < 0) return {text:'Overdue by ' + span(n), cls:'late'};
  if(n === 0) return {text:'Due today', cls:'late'};
  return {text:'Due in ' + span(n), cls:''};
}
const dvSort = (a, c) => (a.date || '9999').localeCompare(c.date || '9999');
function nextDvHtml(b){
  const nd = (b.deliveries || []).filter(x => !x.done).sort(dvSort)[0];
  return nd ? `<div class="meta nd">Next delivery: ${esc(nd.label)} &middot; ${esc(dvState(nd).text.toLowerCase())}</div>` : '';
}

// ---------- persistence ----------
function queue(key, fn){ clearTimeout(timers[key]); timers[key] = setTimeout(() => { delete timers[key]; store && fn(); }, 350); }
const queueBooking = b => queue(b.id, () => store.saveB(b));
const queueLib = l => queue('lib-'+l.type, () => store.saveL(l));
function mutate(id, fn){
  const b = bookings.find(x => x.id === id); if(!b) return;
  fn(b); queueBooking(b); render();
}
function libFor(type){ return lib[type] || (lib[type] = {id:slug(type), type, poses:[], groups:[]}); }
function mutateLib(type, fn){ const l = libFor(type); fn(l); queueLib(l); render(); }
const queueTypes = () => queue('types', () => store.saveT(customTypes));
function addType(raw){
  const name = String(raw||'').trim().replace(/\s+/g,' ').slice(0,40);
  if(!name) return null;
  const hit = allTypes().find(t => slug(t) === slug(name));
  if(hit) return hit;
  customTypes.push(name); queueTypes(); return name;
}

const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('plana', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const d = await this.open(); return new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); },
  async set(k, v){ const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
};
async function readLocalData(){
  try { return { bookings:(await idb.get('bookings')) || [], lib:(await idb.get('lib')) || {}, types:(await idb.get('types')) || [] }; } catch(e){ return null; }
}
async function clearLocalData(){
  try { await idb.set('bookings', []); await idb.set('lib', {}); await idb.set('types', []); } catch(e){}
}
async function localStore(){
  try { bookings = (await idb.get('bookings')) || []; lib = (await idb.get('lib')) || {}; customTypes = (await idb.get('types')) || []; }
  catch(e){ bookings = []; lib = {}; customTypes = []; }
  const persist = () => Promise.all([idb.set('bookings', bookings), idb.set('lib', lib), idb.set('types', customTypes)])
    .catch(() => { $('#mode').textContent = 'Storage is blocked, so recent changes may not be kept.'; });
  return { mode:'local', saveB(){ persist(); }, removeB(){ persist(); }, saveL(){ persist(); }, saveT(){ persist(); } };
}

// ---------- images ----------
function toBlob(file, max){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', .82);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('load')); };
    img.src = u;
  });
}
const blobToDataUrl = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

let pending = null;   // {type, group}
$('#file').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  const target = pending;
  if(!target || !files.length) return;
  for (const f of files){
    try{
      const blob = await toBlob(f, 1000);
      let pose;
      if (assets){ const r = await assets.upload(blob); pose = {id:uid(), url:r.url, asset:r.id}; }
      else { const url = await blobToDataUrl(blob); if(url.length > 900000) throw new Error('big'); pose = {id:uid(), url}; }
      pose.group = target.group; pose.caption = ''; pose.created = Date.now();
      mutateLib(target.type, l => l.poses.push(pose));
    }catch(err){ $('#mode').textContent = 'One image could not be added. Try a smaller JPEG or PNG.'; }
  }
});

// ---------- navigation ----------
function go(v){
  view = v;
  $('#v-bookings').hidden = v!=='bookings';
  $('#v-cal').hidden = v!=='cal';
  $('#v-inspo').hidden = v!=='inspo';
  ['bookings','cal','inspo'].forEach(k => $('#nav-'+k).setAttribute('aria-selected', k===v));
  render();
  window.scrollTo(0,0);
}
function openBooking(id){
  selId = id; tab = (daysLeft(bookings.find(b=>b.id===id))??0) < 0 ? 'past' : 'up';
  $('#layout').dataset.view = 'detail'; go('bookings');
}

// ---------- rendering ----------
function sorted(){
  const list = bookings.map(b => ({b, d:daysLeft(b)}));
  const up = list.filter(x => x.d===null || x.d>=0).sort((a,c) => (a.d??1e9)-(c.d??1e9));
  const past = list.filter(x => x.d!==null && x.d<0).sort((a,c) => c.d-a.d);
  return {up, past};
}
function render(){
  $('#mode').textContent = store && store.mode==='local' ? 'Your bookings are saved on this device.' : '';
  if (view==='bookings') renderBookings();
  else if (view==='cal') renderCalendar();
  else renderInspo();
}

function renderBookings(){
  const {up, past} = sorted();
  $('#tab-up').textContent = 'Upcoming (' + up.length + ')';
  $('#tab-past').textContent = 'Past (' + past.length + ')';
  $('#tab-up').setAttribute('aria-selected', tab==='up');
  $('#tab-past').setAttribute('aria-selected', tab==='past');
  const rows = tab==='up' ? up : past;
  $('#list').innerHTML = rows.length ? rows.map(({b,d}) => `
    <button class="item" data-id="${esc(b.id)}" aria-current="${b.id===selId}">
      <div class="nm">${esc(b.name||'Untitled')} ${b.example?'<span class="chip ex">Example</span>':''}</div>
      <div class="dl">${d===null?'–':Math.abs(d)}<span>${d===null?'NO DATE':d===0?'TODAY':d>0?(d===1?'DAY LEFT':'DAYS LEFT'):'DAYS AGO'}</span></div>
      <div class="meta"><span class="chip">${esc(normType(b.type))}</span> ${esc(fmtDate(b))}</div>
      ${nextDvHtml(b)}
      <div class="bar" aria-hidden="true"><i style="width:${progress(b)}%"></i></div>
    </button>`).join('')
    : `<div class="empty"><b>${tab==='up'?'No upcoming bookings':'Nothing in the past yet'}</b>${tab==='up'?'Add a booking to see how many days are left and what is still open.':'Finished shoots will show up here.'}</div>`;
  renderDetail();
}

function poseLibraryHtml(b){
  const type = normType(b.type), l = lib[type] || {poses:[], groups:[]};
  const names = [...new Set([...groupsFor(type), ...(l.groups||[]), ...l.poses.map(p=>p.group).filter(Boolean)])];
  const shot = b.shot || {};
  const done = l.poses.filter(p => shot[p.id]).length;
  const head = `<div class="ph"><h3>Poses for this ${esc(type.toLowerCase())}</h3><div class="note">${l.poses.length?`${done} of ${l.poses.length} shot`:''}</div></div>`;
  if(!l.poses.length) return `<section class="panel">${head}<div class="empty"><b>No ${esc(type.toLowerCase())} poses saved yet</b>Poses you add under Inspiration show up here for every ${esc(type.toLowerCase())} booking.<br><button class="btn" data-gotoinspo="${esc(type)}">Add poses</button></div></section>`;
  return `<section class="panel">${head}
    ${names.map(g => {
      const gp = l.poses.filter(x => (x.group||names[0]) === g);
      if(!gp.length) return '';
      return `<div class="group">
        <div class="gh"><h4>${esc(g)}<span class="cnt">${gp.filter(x=>shot[x.id]).length}/${gp.length}</span></h4></div>
        <div class="grid">${gp.map(x => `
          <div class="pose ${shot[x.id]?'shot':''}">
            <button class="im" data-open="${esc(x.id)}" aria-label="Enlarge image"><img src="${esc(x.url)}" alt="${esc(x.caption||'Pose reference')}" loading="lazy"></button>
            <label class="tick" title="Mark as shot"><input type="checkbox" data-shot="${esc(x.id)}" ${shot[x.id]?'checked':''} aria-label="Shot"></label>
            <div class="capt">${esc(x.caption)}</div>
          </div>`).join('')}</div>
      </div>`;}).join('')}
    <div style="margin-top:16px"><button class="btn" data-gotoinspo="${esc(type)}">Edit ${esc(type.toLowerCase())} poses</button></div>
  </section>`;
}

    <li class="dv ${x.done?'done':''}">
      <label class="dvl"><input type="checkbox" data-dvdone="${esc(x.id)}" ${x.done?'checked':''}><span>${esc(x.label)}</span></label>

function renderDetail(){
  const el = $('#detail');
  const b = bookings.find(x => x.id===selId);
  if(!b){
    el.innerHTML = `<div class="empty"><b>Select a booking</b>Its countdown, booking progress and poses appear here.</div>`;
    return;
  }
  const d = daysLeft(b), p = progress(b), steps = b.steps||[];
  const nextStep = steps.find(s=>!s.done);
  const big = d===null ? '–' : Math.abs(d);
  const lbl = d===null ? 'Set a date' : d===0 ? 'Shoot day is today' : d>0 ? (d===1?'day to go':'days to go') : (Math.abs(d)===1?'day ago':'days ago');
  const sub = d===null ? '' : d===0 ? '' : span(d) + (d>0?' from now':' since');

  const keep = ['newstep','newdv','newdvdate'].map(id => [id, ($('#'+id) || {}).value]);
  el.innerHTML = `
  <div><button class="btn ghost back" id="back">&larr; All bookings</button></div>
  <div class="hero">
    <div><div class="count">${big}</div><div class="count-l">${lbl}</div><div class="count-s">${esc(sub)}</div></div>
    <div>
      <span class="chip">${esc(normType(b.type))}</span> ${b.example?'<span class="chip ex">Example</span>':''}
      <h2>${esc(b.name||'Untitled')}</h2>
      <div class="facts"><span>${esc(fmtDate(b))}${b.time?' at '+esc(b.time):''}</span>${b.place?`<span>${esc(b.place)}</span>`:''}</div>
      ${b.notes?`<div class="notes">${esc(b.notes)}</div>`:''}
      <div class="hero-actions"><button class="btn" id="edit">Edit details</button>${b.date?'<button class="btn" id="oncal">Show on calendar</button>':''}</div>
    </div>
  </div>

  <section class="panel">
    <div class="ph"><h3>Booking progress</h3><div class="big">${p}%</div></div>
    <div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
    <div class="next">${steps.length===0?'No steps yet. Add the first one below.':nextStep?`Next up: <b>${esc(nextStep.label)}</b>`:'Every step is done.'}</div>
    <ul class="steps">${steps.map((s,i)=>`
      <li class="step ${s.done?'done':''}">
        <label><input type="checkbox" data-step="${i}" ${s.done?'checked':''}><span>${esc(s.label)}</span></label>

  ${poseLibraryHtml(b)}`;
  keep.forEach(([id, v]) => { const i = $('#'+id); if(i && v) i.value = v; });
}

// ---------- calendar ----------
function renderCalendar(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const todayS = ymd(new Date());
  if(!calSel) calSel = todayS;
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;            // Monday first
  const dim = new Date(y, m+1, 0).getDate();
  const rows = Math.ceil((offset + dim) / 7);
  const byDate = {};
  bookings.forEach(b => { if(b.date) (byDate[b.date] = byDate[b.date] || []).push(b); });
  const dvBy = {};
  bookings.forEach(b => (b.deliveries || []).forEach(x => { if(x.date) (dvBy[x.date] = dvBy[x.date] || []).push({b, x}); }));

  let cells = '';
  for(let i=0; i<rows*7; i++){
    const dt = new Date(y, m, 1 - offset + i);
    const s = ymd(dt), out = dt.getMonth()!==m, evs = byDate[s] || [], dvs = dvBy[s] || [];
    const label = dt.toLocaleDateString(undefined,{day:'numeric',month:'long'}) + (evs.length ? ', ' + evs.length + (evs.length===1?' booking':' bookings') : '') + (dvs.length ? ', ' + dvs.length + (dvs.length===1?' delivery due':' deliveries due') : '');
    cells += `<button class="cell ${out?'out':''} ${s===todayS?'today':''} ${s<todayS?'past':''}" data-date="${s}" aria-pressed="${s===calSel}" aria-label="${esc(label)}">
      <span class="n">${dt.getDate()}</span>
      ${[...evs.map(b=>`<span class="ev" style="--p:${progress(b)}%">${esc(b.name||'Untitled')}</span>`), ...dvs.map(({b,x})=>`<span class="ev dev ${x.done?'ok':''}">${esc(x.label)}: ${esc(b.name||'Untitled')}</span>`)].slice(0,2).join('')}
      ${evs.length+dvs.length>2?`<span class="more">+${evs.length+dvs.length-2} more</span>`:''}
    </button>`;
  }
  $('#cal').innerHTML = `
    <div class="calhead">
      <h2>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2>
      <button class="btn" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
      <button class="btn" id="cal-today">Today</button>
      <button class="btn" id="cal-next" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="dow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="days">${cells}</div>
    <div class="note swipehint">Swipe left or right to change month</div>`;

  const evs = byDate[calSel] || [];
  const dvs = dvBy[calSel] || [];
  const dtl = parseDate(calSel).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('#daypanel').innerHTML = `<h3>${esc(dtl)}</h3>` + evs.map(b => {
    const d = daysLeft(b), p = progress(b), next = (b.steps||[]).find(s=>!s.done);
    const posesN = (lib[normType(b.type)]||{poses:[]}).poses.length;
    return `<div class="dcard">
      <div class="top"><div><div class="nm">${esc(b.name||'Untitled')}</div><span class="chip">${esc(normType(b.type))}</span> ${b.time?`<span class="note">${esc(b.time)}</span>`:''}</div><div class="when">${esc(whenText(d))}</div></div>
      <div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
      <div class="pct"><span>Booking progress</span><span>${p}%</span></div>
      <div class="note">${next?`Next up: <b style="color:var(--ink)">${esc(next.label)}</b>`:'Every step is done.'}${posesN?` &middot; ${posesN} ${posesN===1?'pose':'poses'} planned`:''}</div>
      <div><button class="btn primary" data-open-booking="${esc(b.id)}">Open progress and poses</button></div>
    </div>`;}).join('')
    + (dvs.length ? `<h3 style="font-size:16px">Deliveries due</h3>` + dvs.map(({b,x}) => { const st = dvState(x); return `<div class="dcard">
      <div class="top"><div><div class="nm">${esc(x.label)}</div><span class="note">${esc(b.name||'Untitled')} &middot; <span class="chip">${esc(normType(b.type))}</span></span></div><div class="when ${st.cls}">${esc(st.text)}</div></div>
      <label class="dvl" style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" data-dvcal="${esc(b.id)}|${esc(x.id)}" ${x.done?'checked':''}> Delivered</label>
      <div><button class="btn" data-open-booking="${esc(b.id)}">Open booking</button></div>
    </div>`; }).join('') : '')
    + (!evs.length && !dvs.length ? `<div class="empty"><b>Nothing on this day</b>${calSel<todayS?'No bookings or deliveries.':'Tap below to book it.'}${calSel>=todayS?`<br><button class="btn" data-newon="${calSel}">Add booking on this date</button>`:''}</div>` : '');
}

// ---------- events ----------
let suppressClick = false;
function shiftMonth(n){
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1);
  renderCalendar();
  const days = $('#cal .days');
  if(days && days.animate && !matchMedia('(prefers-reduced-motion:reduce)').matches)
    days.animate([{transform:`translateX(${n*28}px)`, opacity:.35}, {transform:'none', opacity:1}], {duration:200, easing:'ease-out'});
}
(function(){
  const el = $('#cal'); let x0 = null, y0 = 0, t0 = 0;
  el.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, {passive:true});
  el.addEventListener('touchend', e => {
    if(x0 === null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - t0 < 800){
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 350);
      shiftMonth(dx < 0 ? 1 : -1);
    }
  }, {passive:true});
})();
$('#nav-bookings').onclick = () => go('bookings');
$('#nav-cal').onclick = () => { calSel = calSel || ymd(new Date()); go('cal'); };
$('#nav-inspo').onclick = () => go('inspo');
$('#tab-up').onclick = () => { tab='up'; render(); };
$('#tab-past').onclick = () => { tab='past'; render(); };
$('#new').onclick = () => openForm(null);

document.addEventListener('click', e => {
  const t = e.target;
  if (suppressClick && t.closest('.cell')) return;
  const item = t.closest('.item'); if(item){ selId = item.dataset.id; $('#layout').dataset.view='detail'; render(); window.scrollTo(0,0); return; }
  if (t.closest('#back')){ $('#layout').dataset.view='list'; return; }
  if (t.closest('#canceltype')){ inspoAdding=false; renderInspo(); return; }
  if (t.closest('#edit')){ openForm(selId); return; }
  if (t.closest('#oncal')){ const b=bookings.find(x=>x.id===selId); calSel=b.date; calMonth=parseDate(b.date); calMonth.setDate(1); go('cal'); return; }
  const ob = t.closest('[data-open-booking]'); if(ob){ openBooking(ob.dataset.openBooking); return; }
  const nw = t.closest('[data-newon]'); if(nw){ openForm(null, nw.dataset.newon); return; }
  const gi = t.closest('[data-gotoinspo]'); if(gi){ inspoCat = gi.dataset.gotoinspo; go('inspo'); return; }
  const cell = t.closest('.cell'); if(cell){
    calSel = cell.dataset.date;
    const d = parseDate(calSel); if(d.getMonth()!==calMonth.getMonth()){ calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
    renderCalendar();
    if(matchMedia('(max-width:820px)').matches) $('#daypanel').scrollIntoView({behavior:'smooth', block:'nearest'});
    return; }
  if (t.closest('#cal-prev')){ shiftMonth(-1); return; }
  if (t.closest('#cal-next')){ shiftMonth(1); return; }
  const am = t.closest('[data-authmode]'); if(am){ showAuth(am.dataset.authmode); return; }
  if (t.closest('#cal-today')){ const n=new Date(); calMonth=new Date(n.getFullYear(), n.getMonth(), 1); calSel=ymd(n); renderCalendar(); return; }
  const ds = t.closest('[data-delstep]'); if(ds){ mutate(selId, b => b.steps.splice(+ds.dataset.delstep,1)); return; }
  const dd = t.closest('[data-deldv]'); if(dd){ mutate(selId, b => { b.deliveries = (b.deliveries||[]).filter(x => x.id !== dd.dataset.deldv); }); return; }
  if (t.closest('[data-defaultdv]')){ mutate(selId, b => { b.deliveries = makeDeliveries(normType(b.type), b.date); }); return; }
  const al = t.closest('[data-addlib]'); if(al){ pending = {type:inspoCat, group:al.dataset.addlib}; $('#file').click(); return; }
  const dl = t.closest('[data-dellib]'); if(dl){
    const id = dl.dataset.dellib;
    mutateLib(inspoCat, l => { const p=l.poses.find(x=>x.id===id); l.poses = l.poses.filter(x=>x.id!==id);
      if(p && p.asset && assets) assets.delete(p.asset).catch(()=>{}); });
    return; }
  const op = t.closest('[data-open]'); if(op){
    const p = findPose(op.dataset.open);
    if(p){ const l = document.createElement('div'); l.className='light'; l.innerHTML = `<img src="${esc(p.url)}" alt="${esc(p.caption||'Pose reference')}">`; l.onclick=()=>l.remove(); document.body.appendChild(l); }
    return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id==='cat'){
    if(t.value==='__new'){ inspoAdding = true; renderInspo(); $('#newtype').focus(); }
    else { inspoAdding = false; inspoCat = t.value; renderInspo(); }
    return; }
  if (t.id==='f-type'){ const w=$('#f-newtype-wrap'); w.hidden = t.value!=='__new'; if(!w.hidden) $('#f-newtype').focus(); return; }
  if (t.dataset.dvdone){ mutate(selId, b => { const x = (b.deliveries||[]).find(d => d.id === t.dataset.dvdone); if(x) x.done = t.checked; }); return; }
  if (t.dataset.dvdate){ mutate(selId, b => { const x = (b.deliveries||[]).find(d => d.id === t.dataset.dvdate); if(x) x.date = t.value; }); return; }
  if (t.dataset.dvcal){ const [bid, did] = t.dataset.dvcal.split('|'); mutate(bid, b => { const x = (b.deliveries||[]).find(d => d.id === did); if(x) x.done = t.checked; }); return; }
  if (t.dataset.step !== undefined) mutate(selId, b => { b.steps[+t.dataset.step].done = t.checked; });
  else if (t.dataset.shot) mutate(selId, b => { b.shot = b.shot || {}; if(t.checked) b.shot[t.dataset.shot]=true; else delete b.shot[t.dataset.shot]; });
  else if (t.dataset.libcap !== undefined){ const l=libFor(inspoCat); const p=l.poses.find(x=>x.id===t.dataset.libcap); if(p){ p.caption=t.value; queueLib(l); } }
});
document.addEventListener('submit', e => {
  if (e.target.id==='addtype'){ e.preventDefault(); const n = addType($('#newtype').value); if(n){ inspoCat = n; inspoAdding = false; renderInspo(); } }
  if (e.target.id==='addstep'){ e.preventDefault(); const v=$('#newstep').value.trim(); if(v) mutate(selId, b => b.steps.push({label:v,done:false})); }
  if (e.target.id==='addgroup'){ e.preventDefault(); const v=$('#newgroup').value.trim(); if(v) mutateLib(inspoCat, l => { if(!l.groups.includes(v)) l.groups.push(v); }); }
  if (e.target.id==='adddv'){ e.preventDefault(); const v=$('#newdv').value.trim(), dt=$('#newdvdate').value; if(v) mutate(selId, b => { (b.deliveries = b.deliveries || []).push({id:uid(), label:v, date:dt, done:false}); }); }
  if (e.target.id==='authform'){ e.preventDefault(); doAuth(); }
});

// ---------- form ----------
function openForm(id, presetDate){
  const b = id ? bookings.find(x=>x.id===id) : {type:'Wedding', date:presetDate||'', time:'', name:'', place:'', notes:''};
  const type = normType(b.type);
  const typeOpts = allTypes().includes(type) ? allTypes() : [...allTypes(), type];
  $('#modal').innerHTML = `
  <div class="overlay"><form class="sheet" id="form">
    <h3>${id?'Edit booking':'New booking'}</h3>
    <label class="f">Who is it for<input type="text" id="f-name" value="${esc(b.name)}" placeholder="Couple or client name" required></label>
    <div class="row2">
      <label class="f">Type<select id="f-type">${typeOpts.map(t=>`<option ${t===type?'selected':''}>${esc(t)}</option>`).join('')}<option value="__new">+ Add another type…</option></select></label>
      <label class="f">Date<input type="date" id="f-date" value="${esc(b.date)}"></label>
    </div>
    <label class="f" id="f-newtype-wrap" hidden>New type<input type="text" id="f-newtype" placeholder="e.g. Conference, Birthday, Product shoot" maxlength="40"></label>
    <div class="row2">
      <label class="f">Start time<input type="time" id="f-time" value="${esc(b.time)}"></label>
      <label class="f">Location<input type="text" id="f-place" value="${esc(b.place)}" placeholder="Venue or area"></label>
    </div>
    <label class="f">Notes<textarea id="f-notes" placeholder="Contact, package, things to remember">${esc(b.notes)}</textarea></label>
    ${id?'':'<div class="note">Steps are filled in for the type you pick, and the poses come from Inspiration. You can change the steps afterwards.</div>'}
    <div class="acts">
      <div>${id?(`<button type="button" class="btn danger" id="f-del">Delete</button>`):''}</div>
      <div style="display:flex;gap:8px"><button type="button" class="btn" id="f-cancel">Cancel</button><button class="btn primary" type="submit">Save</button></div>
    </div>
  </form></div>`;
  $('#f-name').focus();
  $('#f-cancel').onclick = () => $('#modal').innerHTML='';
  const del = $('#f-del');
  if(del) del.onclick = () => {
    if(del.dataset.sure !== '1'){ del.dataset.sure='1'; del.textContent='Tap again to delete'; return; }
    bookings = bookings.filter(x=>x.id!==id); store.removeB(id); selId=null; $('#layout').dataset.view='list'; $('#modal').innerHTML=''; render();
  };
  $('#form').onsubmit = ev => {
    ev.preventDefault();
    let chosenType = $('#f-type').value;
    if(chosenType === '__new'){
      chosenType = addType($('#f-newtype').value);
      if(!chosenType){ $('#f-newtype').focus(); return; }
    }
    const vals = {name:$('#f-name').value.trim(), type:chosenType, date:$('#f-date').value, time:$('#f-time').value, place:$('#f-place').value.trim(), notes:$('#f-notes').value.trim()};
    if(id){ mutate(id, x => Object.assign(x, vals)); }
    else{
      const nb = Object.assign({id:uid(), created:ymd(new Date()), shot:{}, deliveries:makeDeliveries(vals.type, vals.date),
        steps:stepsFor(vals.type).map(label=>({label,done:false}))}, vals);
      bookings.push(nb); selId = nb.id; tab = 'up'; $('#layout').dataset.view='detail'; store.saveB(nb);
      if(view==='cal' && nb.date){ calSel = nb.date; calMonth = parseDate(nb.date); calMonth.setDate(1); }
      render();
    }
    $('#modal').innerHTML='';
  };
}

// ---------- accounts (only when the host page provides a backend) ----------
function showAuth(mode){
  let el = $('#auth');
  if(!el){ el = document.createElement('div'); el.id = 'auth'; el.className = 'auth'; document.body.appendChild(el); }
  el.hidden = false; authMode = mode;
  const logo = '<div class="mark"><span class="logo">P</span><span>PLANA<small>Bookings, calendar and poses</small></span></div>';
  if(mode === 'loading'){ el.innerHTML = `<div class="authcard">${logo}<div class="note" style="text-align:center">Checking your sign-in…</div></div>`; return; }
  const up = mode === 'up', reset = mode === 'reset';
  el.innerHTML = `<div class="authcard">${logo}
    <form class="authbox" id="authform" novalidate>
      ${reset ? '<b>Reset your password</b>' : `<div class="seg" role="tablist"><button type="button" role="tab" data-authmode="in" aria-selected="${!up}">Sign in</button><button type="button" role="tab" data-authmode="up" aria-selected="${up}">Create account</button></div>`}
      <label class="f">Email<input type="email" id="a-email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"></label>
      ${reset ? '' : `<label class="f">Password<input type="password" id="a-pass" autocomplete="${up?'new-password':'current-password'}"></label>`}
      <div class="err" id="a-err" role="alert"></div>
      <button class="btn primary" type="submit" id="a-go">${reset ? 'Send reset link' : up ? 'Create account' : 'Sign in'}</button>
      ${mode === 'in' ? '<button type="button" class="linkbtn" data-authmode="reset">Forgot your password?</button>' : ''}
      ${reset ? '<button type="button" class="linkbtn" data-authmode="in">Back to sign in</button>' : ''}
    </form>
    <div class="note" style="text-align:center">Your bookings and poses are saved to your account, so you can open PLANA on any device.</div>
  </div>`;
}
function hideAuth(){ const el = $('#auth'); if(el) el.hidden = true; }
async function doAuth(){
  const email = $('#a-email').value.trim(), pass = $('#a-pass') ? $('#a-pass').value : '', err = $('#a-err'), go = $('#a-go');
  err.style.color = ''; err.textContent = '';
  if(!email){ err.textContent = 'Enter your email address.'; return; }
  if(authMode !== 'reset' && !pass){ err.textContent = 'Enter your password.'; return; }
  if(authMode === 'up' && pass.length < 6){ err.textContent = 'Use a password with at least 6 characters.'; return; }
  go.disabled = true;
  try{
    if(authMode === 'reset'){ await backend.reset(email); err.style.color = 'var(--ok)'; err.textContent = 'If that email has an account, a reset link is on its way.'; }
    else if(authMode === 'up') await backend.signUp(email, pass);
    else await backend.signIn(email, pass);
  }catch(ex){ err.textContent = (ex && ex.message) || 'Something went wrong. Try again.'; }
  const again = $('#a-go'); if(again) again.disabled = false;
}
function openAccount(){
  if(!currentUser) return;
  $('#modal').innerHTML = `<div class="overlay"><div class="sheet"><h3>Account</h3>
    <div>Signed in as<br><b>${esc(currentUser.email)}</b></div>
    <div class="note">Your bookings and poses sync to every device you sign in on.</div>
    <div class="acts"><button class="btn" id="acct-close">Close</button><button class="btn danger" id="acct-out">Sign out</button></div></div></div>`;
  $('#acct-close').onclick = () => { $('#modal').innerHTML = ''; };
  $('#acct-out').onclick = () => { $('#modal').innerHTML = ''; backend.signOut(); };
}
$('#acct').onclick = openAccount;

function rebuildLib(){
  const next = {};
  const ensure = t => next[t] || (next[t] = {id:slug(t), type:t, poses:[], groups:[]});
  cloud.groups.forEach(g => { if(g && g.type) ensure(g.type).groups = g.groups || []; });
  cloud.poses.forEach(p => { if(p && p.type){ const {type, ...rest} = p; ensure(type).poses.push(rest); } });
  Object.keys(next).forEach(t => next[t].poses.sort((a, c) => (a.created || 0) - (c.created || 0)));
  Object.keys(lib).forEach(t => { if(timers['lib-'+t]) next[t] = lib[t]; });
  if(sig(next) === sig(lib)) return;
  lib = next; render();
}
async function maybeOfferImport(){
  if(typeof readLocalData !== 'function') return;
  try{ if(localStorage.getItem('plana-skip-import')) return; }catch(e){}
  const left = await readLocalData();
  if(!left) return;
  const poseCount = Object.keys(left.lib).reduce((n, t) => n + ((left.lib[t].poses || []).length), 0);
  if(!left.bookings.length && !poseCount) return;
  const el = $('#banner'); el.hidden = false;
  const bits = [];
  if(left.bookings.length) bits.push(left.bookings.length + (left.bookings.length === 1 ? ' booking' : ' bookings'));
  if(poseCount) bits.push(poseCount + (poseCount === 1 ? ' pose photo' : ' pose photos'));
  el.innerHTML = `<span>PLANA found ${bits.join(' and ')} saved on this device from before you signed in. Add them to your account?</span><button class="btn primary" id="imp-yes">Add to my account</button><button class="btn" id="imp-no">No thanks</button>`;
  $('#imp-no').onclick = () => { try{ localStorage.setItem('plana-skip-import', '1'); }catch(e){} el.hidden = true; };
  $('#imp-yes').onclick = async () => {
    left.bookings.forEach(b => { if(!bookings.some(x => x.id === b.id)){ bookings.push(b); store.saveB(b); } });
    (left.types || []).forEach(t => { if(!allTypes().some(x => slug(x) === slug(t))) customTypes.push(t); });
    if((left.types || []).length) queueTypes();
    Object.keys(left.lib).forEach(t => {
      const l = libFor(t), src = left.lib[t];
      (src.poses || []).forEach(p => { if(!l.poses.some(x => x.id === p.id)) l.poses.push(p); });
      (src.groups || []).forEach(g => { if(!l.groups.includes(g)) l.groups.push(g); });
      store.saveL(l);
    });
    await clearLocalData(); el.hidden = true; render();
  };
}
function startCloud(be){
  backend = be; showAuth('loading');
  be.onAuth(user => {
    if(session){ session.close(); session = null; }
    store = null; bookings = []; lib = {}; customTypes = []; selId = null; cloud = {poses:[], groups:[]};
    currentUser = user; $('#banner').hidden = true; $('#layout').dataset.view = 'list';
    if(!user){ $('#acct').hidden = true; showAuth('in'); render(); return; }
    hideAuth();
    $('#acct').hidden = false; $('#acct').textContent = (user.email || '?').charAt(0).toUpperCase();
    session = be.open(user.uid, {
      onBookings: list => {
        const merged = list.map(b => bookings.find(x => x.id === b.id && timers[b.id]) || b);
        if(sig(merged) === sig(bookings)) return;
        bookings = merged;
        if(!bookings.some(b => b.id === selId)) selId = null;
        if(!selId) $('#layout').dataset.view = 'list';
        if(!selId && matchMedia('(min-width:821px)').matches){ const sv = sorted(); const f = sv.up[0] || sv.past[0]; if(f) selId = f.b.id; }
        render();
      },
      onPoses: list => { cloud.poses = list; rebuildLib(); },
      onGroups: list => { cloud.groups = list; rebuildLib(); },
      onTypes: list => { if(timers['types'] || sig(list) === sig(customTypes)) return; customTypes = list; render(); },
      onError: msg => { $('#mode').textContent = msg; }
    });
    store = session.store;
    maybeOfferImport();
    render();
  });
}

// ---------- boot ----------
render();
(async function boot(){
  if (window.__backendReady){
    let be = null;
    try { be = await Promise.race([window.__backendReady, new Promise(r => setTimeout(() => r(null), 8000))]); } catch(e){ be = null; }
    if (be){ startCloud(be); return; }
  }
  let db = null;
  try { db = await claude.use('db'); } catch(e){}
  try { assets = await claude.use('assets'); } catch(e){ assets = null; }
  if (!db){ store = await localStore(); if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); render(); return; }
  const colB = db.collection('bookings'), colL = db.collection('inspiration'), colS = db.collection('settings');
  const warn = () => { $('#mode').textContent = 'A change could not be saved. Check your connection and try again.'; };
  store = {
    mode:'db',
    saveB: b => colB.doc(b.id).set(b).catch(warn),
    removeB: id => colB.doc(id).delete().catch(()=>{}),
    saveL: l => colL.doc(l.id).set(l).catch(warn),
    saveT: list => colS.doc('types').set({list}).catch(warn)
  };
  colB.onSnapshot(snap => {
    const incoming = snap.docs.map(d => d.data()).filter(Boolean);
    const merged = incoming.map(b => bookings.find(x => x.id===b.id && timers[b.id]) || b);
    if(sig(merged) === sig(bookings)) return;
    bookings = merged;
    if(!bookings.some(b=>b.id===selId)) selId = null;
    if(!selId) $('#layout').dataset.view = 'list';
    if(!selId && matchMedia('(min-width:821px)').matches){ const s=sorted(); const f=(s.up[0]||s.past[0]); if(f) selId=f.b.id; }
    render();
  }, async () => { store = await localStore(); render(); });
  colL.onSnapshot(snap => {
    const next = {};
    snap.docs.map(d => d.data()).filter(Boolean).forEach(l => { next[l.type] = (timers['lib-'+l.type] && lib[l.type]) || Object.assign({poses:[],groups:[]}, l); });
    Object.keys(lib).forEach(t => { if(timers['lib-'+t]) next[t] = lib[t]; });
    lib = next;
    render();
  }, () => {});
  colS.doc('types').onSnapshot(s => {
    if(!timers['types']) customTypes = (s.exists && s.data() && s.data().list) || [];
    render();
  }, () => {});
})();
})();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
